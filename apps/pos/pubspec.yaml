name: pos
description: "GrowFlow Point of Sale Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management & Routing
  flutter_bloc: ^8.1.3
  go_router: ^14.0.0
  
  # Local Database (drift / sqlite)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.17
  path_provider: ^2.1.1
  path: ^1.9.0
  uuid: ^4.3.3
  
  # Network & Sync
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation for drift ORM
  drift_dev: ^2.14.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
